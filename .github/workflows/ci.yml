name: GodMode V2 CI

on:
  push:
    branches:
      - godmode-v2/build-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godmode-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build all workspaces
        env:
          # Reserved .invalid domain keeps the Expo static build isolated from production.
          EXPO_PUBLIC_DOMAIN: godmode-ci.invalid
        run: pnpm build

      - name: Package complete V2 source
        run: git archive --format=zip --output=godmode-v2-source.zip HEAD

      - name: Upload V2 source archive
        uses: actions/upload-artifact@v4
        with:
          name: evolved-godmode-v2-source
          path: godmode-v2-source.zip
          if-no-files-found: error
          retention-days: 14
