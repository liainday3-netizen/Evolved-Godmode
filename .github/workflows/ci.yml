name: GodMode V2 CI

on:
  push:
    branches:
      - godmode-v2/build-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: godmode-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build all workspaces
        run: pnpm build
