kind = "mobile"
previewPath = "/"
title = "GODMODE"
version = "1.0.0"
id = "artifacts/godmode"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19007

[services.development]
run = "pnpm --filter @workspace/godmode run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/godmode", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/godmode", "run", "serve" ]

[services.env]
PORT = "19007"
BASE_PATH = "/"
